  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px 16px; min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif; color: #202124;
      background: #f4f6f8; display: flex; justify-content: center; align-items: flex-start;
    }
    main {
      width: 100%; max-width: 560px; margin-top: 28px; padding: 34px;
      background: #fff; border: 1px solid #e1e5e9; border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }
    .ub { text-align: center; color: #333; font-weight: 700; letter-spacing: .04em; font-size: 18px; margin-bottom: 28px; }
    h1 { text-align: center; font-size: 23px; line-height: 1.25; margin: 0 0 10px; }
    .intro { text-align: center; color: #5f6368; margin: 0 0 28px; font-size: 15px; }
    label { display: block; font-weight: 600; margin: 18px 0 7px; }
    input { display: block; width: 100%; padding: 13px 12px; font-size: 16px; border: 1px solid #c8cdd2; border-radius: 6px; background: white; }
    input:focus { outline: 2px solid #8ab4f8; border-color: #1a73e8; }
    button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 6px; background: #173e68; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #102f52; }
    #resultat { margin-top: 22px; padding: 14px; border-radius: 6px; text-align: center; display: none; }
    #resultat.ok { display: block; background: #e8f3eb; color: #185c2c; }
    #resultat.error { display: block; background: #fcebea; color: #a12622; }
    .nota { font-size: 30px; font-weight: 700; margin-top: 8px; }
  </style>
</head>

    function normalitza(valor) {
      return (valor || "").trim().toLowerCase().replace(/\s+/g, "");
    }

    function consultaNota() {
      const emailInput = normalitza(document.getElementById("email").value);
      let niubInput = normalitza(document.getElementById("niub").value);
      const resultat = document.getElementById("resultat");

      resultat.className = "";
      resultat.style.display = "none";
      resultat.textContent = "";

      if (!emailInput || !niubInput) {
        resultat.className = "error";
        resultat.textContent = "Introdueix l'adreça electrònica i el número NIUB.";
        return;
      }

      if (!niubInput.startsWith("niub")) {
        niubInput = "niub" + niubInput;
      }

      const alumne = alumnesDades[niubInput];

      if (alumne && normalitza(alumne.email) === emailInput) {
        resultat.className = "ok";
        resultat.innerHTML = "La teva nota de l'AC1 és:<div class='nota'>" + alumne.nota + "</div>";
      } else {
        resultat.className = "error";
        resultat.textContent = "Accés denegat. Correu electrònic o NIUB no coincidents.";
      }
    }

    document.getElementById("botoConsulta").addEventListener("click", function(e) {
  e.preventDefault();
  consultaNota();
});

    document.getElementById("niub").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        consultaNota();
      }
    });

    document.getElementById("email").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        consultaNota();
      }
    });
