<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de qualificacions AC1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin-top: 28px;
      padding: 34px;
      background: #fff;
      border: 1px solid #e1e5e9;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .ub {
      text-align: center;
      color: #333;
      font-weight: 700;
      letter-spacing: .04em;
      font-size: 18px;
      margin-bottom: 28px;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      line-height: 1.25;
      margin: 0 0 10px;
    }

    .intro {
      text-align: center;
      color: #5f6368;
      margin: 0 0 28px;
      font-size: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 18px 0 7px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px 12px;
      font-size: 16px;
      border: 1px solid #c8cdd2;
      border-radius: 6px;
      background: white;
    }

    input:focus {
      outline: 2px solid #8ab4f8;
      border-color: #1a73e8;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 6px;
      background: #173e68;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #102f52;
    }

    #resultat {
      margin-top: 22px;
      padding: 14px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }

    #resultat.ok {
      display: block;
      background: #e8f3eb;
      color: #185c2c;
    }

    #resultat.error {
      display: block;
      background: #fcebea;
      color: #a12622;
    }

    .nota {
      font-size: 30px;
      font-weight: 700;
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      main {
        padding: 25px 20px;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="ub">UNIVERSITAT DE BARCELONA</div>

    <h1>Consulta de qualificacions</h1>
    <p class="intro">Activitat AC1</p>

    <div id="formulari">

      <label for="email">Adreça electrònica</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="niub">Número NIUB</label>
      <input
        id="niub"
        name="niub"
        type="text"
        inputmode="text"
        autocomplete="off"
        required
      >

      <button
        type="button"
        id="botoConsulta"
      >
        Consultar nota
      </button>

    </div>

    <div id="resultat" role="status" aria-live="polite"></div>
  </main>

    // Convertim les dades en una llista d'alumnes.
    const alumnes = dades
      .trim()
      .split("\n")
      .map(function(linia) {
        const camps = linia.trim().split("|");
        return {
          niub: camps[0],
          email: camps[1],
          grade: camps[2]
        };
      });

    const campEmail = document.getElementById("email");
    const campNiub = document.getElementById("niub");
    const resultat = document.getElementById("resultat");

    function normalitza(valor) {
      return valor.trim().toLowerCase().replace(/\s+/g, "");
    }

    function consultaNota() {
      const email = normalitza(campEmail.value);
      let niub = normalitza(campNiub.value);

      resultat.className = "";
      resultat.style.display = "none";
      resultat.textContent = "";

      if (!email || !niub) {
        resultat.className = "error";
        resultat.textContent = "Introdueix l'adreça electrònica i el número NIUB.";
        return;
      }

      if (!niub.startsWith("niub")) {
        niub = "niub" + niub;
      }

      const alumne = alumnes.find(function(registre) {
        return registre.email === email && registre.niub === niub;
      });

      if (alumne) {
        resultat.className = "ok";
        resultat.innerHTML =
          "La teva nota de l'AC1 és:<div class='nota'>" +
          alumne.grade.replace(".", ",") +
          "</div>";
      } else {
        resultat.className = "error";
        resultat.textContent =
          "Accés denegat. Comprova que el correu electrònic i el NIUB siguin correctes.";
      }
    }

    document.getElementById("botoConsulta").addEventListener("click", function(event) {
      event.preventDefault();
      consultaNota();
    });

    campEmail.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        consultaNota();
      }
    });

    campNiub.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        consultaNota();
      }
    });
  </script>
