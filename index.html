<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Qualificacions AC1 - Universitat de Barcelona</title>
  <style>
    :root {
      --ub-blue: #003366;
      --ub-gold: #d4af37;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #166534;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--border);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ub-blue);
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--ub-blue);
    }

    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 0.5rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--ub-blue);
      box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.15);
    }

    button {
      width: 100%;
      padding: 0.875rem;
      background-color: var(--ub-blue);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    button:hover {
      background-color: #002244;
    }

    .result-card {
      margin-top: 1.5rem;
      padding: 1.5rem;
      border-radius: 0.5rem;
      display: none;
      text-align: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .result-card.success {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .result-card.error {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .result-label {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      opacity: 0.8;
    }

    .result-value {
      font-size: 2.5rem;
      font-weight: 800;
    }

    .result-niub {
      font-size: 0.875rem;
      margin-top: 0.5rem;
      opacity: 0.9;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Qualificacions AC1</h1>
      <p>Introdueix el teu correu electrònic i el teu NIUB per consultar la teva nota</p>
    </div>

    <form id="authForm" onsubmit="event.preventDefault(); verificarDades();">
      <div class="form-group">
        <label for="emailInput">Correu Electrònic</label>
        <input 
          type="email" 
          id="emailInput" 
          placeholder="ex: nom.cognom@alumnes.ub.edu" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="niubInput">Número d'Identificació (NIUB)</label>
        <input 
          type="text" 
          id="niubInput" 
          placeholder="ex: 22402262 o niub22402262" 
          required 
          autocomplete="off"
        >
      </div>

      <button type="submit">Consultar Qualificació</button>
    </form>

    <div id="resultCard" class="result-card">
      <div class="result-label" id="resultLabel">Qualificació AC1</div>
      <div class="result-value" id="resultValue">-</div>
      <div class="result-niub" id="resultNiub"></div>
    </div>
  </div>

    function verificarDades() {
      const emailInput = document.getElementById('emailInput').value.trim().toLowerCase();
      const niubRaw = document.getElementById('niubInput').value.trim().toLowerCase();
      const resultCard = document.getElementById('resultCard');
      const resultLabel = document.getElementById('resultLabel');
      const resultValue = document.getElementById('resultValue');
      const resultNiub = document.getElementById('resultNiub');

      // Normalitzar automàticament el NIUB (permet escriure "22402262" o "niub22402262")
      let niubKey = niubRaw;
      if (!niubKey.startsWith('niub')) {
        niubKey = 'niub' + niubKey;
      }

      // Comprovar si el NIUB existeix a la base de dades
      if (!alumnesDades.hasOwnProperty(niubKey)) {
        mostrarError('NIUB no trobat', 'El NIUB introduït no consta a la llista d\'aquesta activitat.');
        return;
      }

      const alumne = alumnesDades[niubKey];

      // Comprovar que el correu electrònic coincideixi exactament amb el del registre
      if (alumne.email.toLowerCase() !== emailInput) {
        mostrarError('Error de verificació', 'El correu electrònic introduït no coincideix amb el registre associat a aquest NIUB.');
        return;
      }

      // Si tot és correcte, mostrar la qualificació
      resultCard.className = 'result-card success';
      resultLabel.textContent = 'La teva Qualificació AC1';
      resultValue.textContent = alumne.nota;
      resultNiub.textContent = `Correu: ${alumne.email} | NIUB: ${niubKey.toUpperCase()}`;
      resultCard.style.display = 'block';
    }

    function mostrarError(títol, missatge) {
      const resultCard = document.getElementById('resultCard');
      resultCard.className = 'result-card error';
      document.getElementById('resultLabel').textContent = títol;
      document.getElementById('resultValue').textContent = 'Accés Denegat';
      document.getElementById('resultNiub').textContent = missatge;
      resultCard.style.display = 'block';
    }
  </script>
