<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Qualificacions AC1 - Universitat de Barcelona</title>
  <style>
    :root {
      --ub-blue: #003366;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #166534;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--border);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header .ub-name {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--ub-blue);
      margin-bottom: 0.8rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ub-blue);
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--ub-blue);
    }

    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 0.5rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--ub-blue);
      box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.15);
    }

    button {
      width: 100%;
      padding: 0.875rem;
      background-color: var(--ub-blue);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    button:hover {
      background-color: #002244;
    }

    .result-card {
      margin-top: 1.5rem;
      padding: 1.5rem;
      border-radius: 0.5rem;
      display: none;
      text-align: center;
    }

    .result-card.success {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    .result-card.error {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .result-label {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      opacity: 0.8;
    }

    .result-value {
      font-size: 2.5rem;
      font-weight: 800;
    }

    .result-niub {
      font-size: 0.875rem;
      margin-top: 0.5rem;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <p class="ub-name">UNIVERSITAT DE BARCELONA</p>
      <h1>Qualificacions AC1</h1>
      <p>Introdueix el teu correu electrònic i el teu NIUB per consultar la teva nota</p>
    </div>

    <form id="authForm" novalidate>

      <div class="form-group">
        <label for="emailInput">Correu Electrònic</label>
        <input
          type="email"
          id="emailInput"
          placeholder="ex: nom.cognom@alumnes.ub.edu"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="niubInput">Número d'Identificació (NIUB)</label>
        <input
          type="text"
          id="niubInput"
          placeholder="ex: 22402262"
          required
          autocomplete="off"
        >
      </div>

      <button type="button" id="consultButton">
        Consultar Qualificació
      </button>

    </form>

    <div id="resultCard" class="result-card" role="status" aria-live="polite">
      <div class="result-label" id="resultLabel">Qualificació AC1</div>
      <div class="result-value" id="resultValue">-</div>
      <div class="result-niub" id="resultNiub"></div>
    </div>

  </div>

    const alumnesDades = Object.fromEntries(
      dadesText.trim().split(/\n/).map(linia => {
        const [niub, email, nota] = linia.trim().split("|");
        return [niub, { email, nota }];
      })
    );

    // Funció auxiliar per netejar espais invisibles, insecables i majúscules
    function netejarText(text) {
      if (!text) return '';
      return text.replace(/[\s\u00A0\u200B]/g, '').toLowerCase();
    }

    function verificarDades() {
      const emailInput = netejarText(document.getElementById('emailInput').value);
      const niubRaw = netejarText(document.getElementById('niubInput').value);
      const resultCard = document.getElementById('resultCard');
      const resultLabel = document.getElementById('resultLabel');
      const resultValue = document.getElementById('resultValue');
      const resultNiub = document.getElementById('resultNiub');

      if (!emailInput || !niubRaw) {
        mostrarError('Dades incompletes', 'Introdueix el correu electrònic i el NIUB.');
        return;
      }

      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailInput)) {
        mostrarError('Correu no vàlid', 'Revisa el format del correu electrònic.');
        return;
      }

      let niubKey = niubRaw;
      if (!niubKey.startsWith('niub')) {
        niubKey = 'niub' + niubKey;
      }

      if (!alumnesDades.hasOwnProperty(niubKey)) {
        mostrarError('NIUB no trobat', 'El NIUB introduït no consta a la llista.');
        return;
      }

      const alumne = alumnesDades[niubKey];
      const emailRegistrat = netejarText(alumne.email);

      if (emailRegistrat !== emailInput) {
        mostrarError('Error de verificació', 'El correu electrònic no coincideix amb aquest NIUB.');
        return;
      }

      resultCard.className = 'result-card success';
      resultLabel.textContent = 'La teva Qualificació AC1';
      resultValue.textContent = alumne.nota;
      resultNiub.textContent = `Correu: ${alumne.email} | NIUB: ${niubKey.toUpperCase()}`;
      resultCard.style.display = 'block';
    }

    function mostrarError(títol, missatge) {
      const resultCard = document.getElementById('resultCard');
      resultCard.className = 'result-card error';
      document.getElementById('resultLabel').textContent = títol;
      document.getElementById('resultValue').textContent = 'Accés Denegat';
      document.getElementById('resultNiub').textContent = missatge;
      resultCard.style.display = 'block';
    }

    // Registra els esdeveniments sense atributs onclick dins l'HTML.
    const formulariConsulta = document.getElementById('authForm');
    const botoConsulta = document.getElementById('consultButton');

    botoConsulta.addEventListener('click', verificarDades);

    formulariConsulta.addEventListener('submit', function(event) {
      event.preventDefault();
      verificarDades();
    });

    // També permet consultar prement Retorn en qualsevol dels camps.
    document.querySelectorAll('#authForm input').forEach(function(camp) {
      camp.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          verificarDades();
        }
      });
    });

  </script>
